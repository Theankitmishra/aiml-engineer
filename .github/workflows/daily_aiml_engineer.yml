name: Daily AI/ML GitHub Engineer

on:
  schedule:
    # ~9:13 AM Asia/Kolkata (UTC+5:30) == 03:43 UTC (off-minute avoids :00/:30 queue drops)
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional target issue (owner/repo#number). Leave blank for auto-discovery."
        required: false
        default: ""
      provider:
        description: "LLM provider (auto picks GROQ_API_KEY > HF_TOKEN > OPENAI_API_KEY > GEMINI_API_KEY)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - groq
          - huggingface
          - gemini
          - openai
      model:
        description: "Optional model override (leave blank for provider default)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  solve-and-distill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aiml-engineer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve provider and verify API key secret
        id: resolve_provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REQUESTED="${{ inputs.provider || 'auto' }}"
          if [ "$REQUESTED" = "auto" ]; then
            if [ -n "$GROQ_API_KEY" ]; then
              PROVIDER="groq"
            elif [ -n "$HF_TOKEN" ]; then
              PROVIDER="huggingface"
            elif [ -n "$OPENAI_API_KEY" ]; then
              PROVIDER="openai"
            elif [ -n "$GEMINI_API_KEY" ]; then
              PROVIDER="gemini"
            else
              echo "::error::No LLM API key secret found. Add GROQ_API_KEY (recommended free), HF_TOKEN, OPENAI_API_KEY, or GEMINI_API_KEY under Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          else
            PROVIDER="$REQUESTED"
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "Using provider: $PROVIDER"

      - name: Run autonomous AI/ML engineer
        id: agent_run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PROVIDER="${{ steps.resolve_provider.outputs.provider }}"
          MODEL="${{ inputs.model }}"
          ISSUE="${{ inputs.issue }}"
          CMD=(aiml-engineer run --provider "$PROVIDER")
          if [ -n "$MODEL" ]; then
            CMD+=(--model "$MODEL")
          fi
          if [ -n "$ISSUE" ]; then
            CMD+=(--issue "$ISSUE")
          fi
          "${CMD[@]}" 2>&1 | tee /tmp/agent_run.log
          RUN_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$RUN_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$RUN_EXIT" -ne 0 ]; then
            echo "### Agent Run Failed (exit $RUN_EXIT)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 /tmp/agent_run.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export updated SFT/DPO datasets & status
        if: always()
        run: |
          aiml-engineer export-data
          echo "### aiml-engineer Status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          aiml-engineer status >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR drafts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-drafts
          path: drafts/
          if-no-files-found: ignore

      - name: Commit updated drafts, playbook, and trajectories
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/ PLAYBOOK.md runs_log.jsonl trajectories/ eval/ training_data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: record daily aiml-engineer run"
            git pull --rebase --autostash
            git push
          else
            echo "No workspace updates to commit."
          fi

      - name: Fail job if agent run failed
        if: steps.agent_run.outputs.exit_code != '0'
        run: |
          echo "aiml-engineer run failed with exit code ${{ steps.agent_run.outputs.exit_code }}."
          exit 1
